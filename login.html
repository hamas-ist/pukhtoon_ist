<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Council Portal Login — PUKHTOON COMMUNITY IST</title>
  <meta name="description" content="Authorized executive access portal for Pukhtoon Society council officers and financial auditors at IST Islamabad.">
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sofia-pro">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-pukhtoon-grid" style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 2rem 1rem;">

  <!-- Ambient Blue Glow -->
  <div style="position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 480px; height: 320px; background: rgba(0, 113, 227, 0.12); border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: -1;"></div>

  <div style="position: absolute; top: 1.5rem; left: 1.5rem;">
    <a href="index.html" class="society-logo">
      <div class="logo-symbol" style="width: 2rem; height: 2rem;">
        <img src="images/logo.png" alt="Pukhtoon Community" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <svg style="display:none;" viewBox="0 0 40 40" fill="none" width="18" height="18">
          <polygon points="20,2 25,14 38,14 28,22 32,35 20,27 8,35 12,22 2,14 15,14" stroke="currentColor" stroke-width="2" fill="currentColor"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-title">PUKHTOON <span>COMMUNITY</span></span>
        <span class="logo-subtitle">IST ISLAMABAD</span>
      </div>
    </a>
  </div>

  <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
    <button class="btn btn-icon theme-toggle-btn" onclick="Theme.toggle()" title="Toggle Theme">
      <i data-lucide="moon" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Login Card -->
  <div class="card card-glass" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; padding: 2rem 2rem 1rem;">
      <div style="width: 4rem; height: 4rem; margin: 0 auto 1.25rem; border-radius: 1.125rem; background: #FFFFFF; padding: 0.375rem; border: 1px solid rgba(0, 113, 227, 0.25); box-shadow: 0 8px 24px rgba(0, 113, 227, 0.15); display: flex; align-items: center; justify-content: center;">
        <img src="images/logo.png" alt="Pukhtoon Community" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;">Council Command Portal</h1>
      <p style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.375rem;">
        Authorized credentials required for executive community operations
      </p>
    </div>

    <div style="padding: 1rem 2rem 2rem;">
      <!-- Form -->
      <form id="loginForm" onsubmit="handleFormSubmit(event)" autocomplete="off" style="display: flex; flex-direction: column; gap: 1.125rem;">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Username or IST Email</label>
          <div style="position: relative;">
            <input type="text" id="loginEmail" class="form-input" required placeholder="hamaskhan or name@ist.edu.pk" autocomplete="off" style="padding-left: 2.25rem;">
            <i data-lucide="user" class="w-4 h-4" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Confidential Password</label>
          <div style="position: relative;">
            <input type="password" id="loginPassword" class="form-input" required placeholder="Enter confidential password" autocomplete="new-password" style="padding-left: 2.25rem; padding-right: 2.5rem;">
            <i data-lucide="lock" class="w-4 h-4" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;"></i>
            <button type="button" onclick="togglePasswordVisibility()" title="Toggle password visibility" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); padding: 0.25rem; display: flex; align-items: center; justify-content: center;">
              <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted);">
          <label style="display: flex; align-items: center; gap: 0.375rem; cursor: pointer;">
            <input type="checkbox" style="accent-color: var(--accent-blue);">
            <span>Remember session on this device</span>
          </label>
          <a href="#" onclick="alert('Please contact Super Admin Hamas Khan (Finance Secretary) for credential recovery.'); return false;" style="color: var(--accent-blue);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 0.5rem; width: 100%;">
          <span>Sign In to Command Hub</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: center;">
        <a href="transparency.html" style="font-size: 0.75rem; color: var(--text-muted); transition: color 0.15s ease;">
          ← Return to Public Transparency Portal
        </a>
      </div>
    </div>
  </div>

  <div style="margin-top: 2rem; font-size: 0.75rem; color: var(--text-subtle); text-align: center;">
    Protected by Pukhtoon Community RBAC Guard • IST Directorate of Student Affairs
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) lucide.createIcons();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      // Find in COUNCIL_ACCOUNTS by email or username
      const matched = Object.values(COUNCIL_ACCOUNTS).find(a => 
        a.email.toLowerCase() === identifier || a.username.toLowerCase() === identifier
      );

      if (matched) {
        if (matched.password === password) {
          Auth.setUser(matched);
          showToast('Welcome ' + matched.name, `Authenticated as ${matched.title}`, 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 350);
          return;
        } else {
          showToast('Authentication Error', 'Incorrect password entered. Please try again.', 'error');
          return;
        }
      }

      // Guest / Other Member View-Only Mode
      if (password) {
        const guestUser = {
          name: identifier.split('@')[0].toUpperCase(),
          username: identifier.split('@')[0],
          email: identifier.includes('@') ? identifier : `${identifier}@ist.edu.pk`,
          role: 'VIEWER',
          title: 'Community Member (Viewer)',
          avatar: identifier.substring(0, 2).toUpperCase()
        };
        Auth.setUser(guestUser);
        showToast('Authenticated', 'Logged in with View-Only permissions', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 350);
      } else {
        showToast('Authentication Error', 'Please enter your password.', 'error');
      }
    }
  </script>
</body>
</html>
